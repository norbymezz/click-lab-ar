<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Click Lab AR</title><style>html,body{margin:0;padding:0;background:#111;height:100%;overflow:hidden}#wrap{display:flex;justify-content:center;align-items:center;height:100vh}img{max-width:100%;max-height:100vh;cursor:pointer}</style></head><body><div id='wrap'><img id='hero' src='img1.png'></div><script>const imgs=['img1.png','img2.png','img3.png'];let i=0;setInterval(()=>{i=(i+1)%imgs.length;document.getElementById('hero').src=imgs[i];},2000);document.getElementById('hero').onclick=()=>window.location='https://norbymezz.github.io/click-lab-ar/';</script></body></html>
